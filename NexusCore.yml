# Nexus Core — txAdmin deployment recipe
#
# Provisions a FiveM server with the Nexus Core framework.
#
# TARGETS GTA V ENHANCED. Nexus Core targets FiveM for GTA V Enhanced and the
# Enhanced Cfx Server runtime (ADR-0016, MDD v0.4 section 38).
#
# A recipe cannot install or verify the server artifacts. txAdmin runs a recipe
# on a server that already exists, so THE OPERATOR IS RESPONSIBLE for having
# installed Enhanced Cfx Server artifacts before deploying this. Running it on
# a Legacy FXServer will appear to succeed.
#
# What the recipe can do, and does: it no longer pins a Legacy game build, and
# it requires the operator to record the exact server build in server.cfg, which
# nxc_core validates at startup and refuses to run without.
#
# THIS RECIPE INSTALLS ONLY WHAT IS PUBLISHED. Nexus Core is in Phase 1 of
# eleven. Framework resources are added to this recipe as each is released; a
# recipe that referenced an unpublished repository would fail at deployment
# while looking complete in review.
#
# See docs/coverage.md for exactly what is and is not installed.

# Metadata matches the OFFICIAL Enhanced reference recipe
# (citizenfx/txAdmin-recipes, default-fivem-enhanced), which is the only
# authoritative statement of what an Enhanced recipe may declare.
#
# $minFxVersion IS DELIBERATELY ABSENT. It previously read 7290, and that is what
# broke deployment: "this recipe requires FXServer v7290 or above". The Enhanced
# server is a SEPARATE artifact — renamed Cfx Server — that entered early access
# on 2026-07-21 with its own build numbering, well below the Legacy series that
# 7290 came from. A Legacy-era minimum can never be satisfied by an Enhanced
# server, however new it is. The official Enhanced reference declares no minimum
# either.
#
# The right guard is a manifest dependency, not recipe metadata: fxmanifest.lua
# supports `dependencies { '/server:NNNN' }`. That is per-resource and enforced
# by the server itself. It is not set yet because no build has been named
# (OD-020, blocker B-11).
#
# $onesync is absent for the same reason: the official Enhanced reference omits
# it while the Legacy reference sets it to `on`. Matching the reference rather
# than reasoning about why.
$engine: 3
$steamRequired: false

name: Nexus Core
version: 0.1.0
author: The Nexus Core Framework team
description: >-
  A custom FiveM roleplay framework built around player experience, useful work,
  meaningful ownership, and interconnected systems. Phase 1 — foundation only.
  Not ready for production use.

tasks:
  # ---------------------------------------------------------------- structure
  - action: ensure_dir
    path: ./resources/[nexus]

  - action: ensure_dir
    path: ./resources/[nexus-deps]

  # ------------------------------------------------------------- base payload
  # Server configuration template and branding, pulled from this repository.
  - action: download_github
    src: https://github.com/NC-Framework/NXC_TXAdmin
    ref: main
    dest: ./tmp/nxc_txadmin

  - action: move_path
    src: ./tmp/nxc_txadmin/data/server.cfg.template
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/nxc_txadmin/myLogo.png
    dest: ./myLogo.png

  # ------------------------------------------------------------------ database
  - action: connect_database

  # Creates the migration-tracking table and nothing else. Every other table
  # belongs to a resource domain, and each resource applies its own migrations
  # at startup. A deployment recipe creating domain tables would be writing
  # state it does not own.
  - action: query_database
    file: ./tmp/nxc_txadmin/data/schema/0001_bootstrap.sql

  # -------------------------------------------------------------- CitizenFX
  # SELECTIVE, not the whole tree.
  #
  # The Legacy reference recipe drops all of cfx-server-data/resources into
  # ./resources. The Enhanced reference recipe does not — it copies named
  # resources one at a time. That difference is the reference telling us not
  # everything in that repository is Enhanced-safe, so this follows the Enhanced
  # pattern.
  #
  # Only two are taken. basic-gamemode and the demo maps are omitted because
  # Nexus Core IS the gamemode; installing a demo one alongside it would be
  # installing a second, conflicting answer to the same question.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./tmp/cfx-server-data

  - action: move_path
    src: ./tmp/cfx-server-data/[managers]/mapmanager
    dest: ./resources/[cfx-default]/mapmanager

  - action: move_path
    src: ./tmp/cfx-server-data/[managers]/spawnmanager
    dest: ./resources/[cfx-default]/spawnmanager

  # ------------------------------------------------------------- dependencies
  # oxmysql is the approved database driver and a permanent framework
  # dependency. Pinned to a release rather than a moving branch, so two
  # deployments a week apart install the same code.
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/download/v2.9.1/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[nexus-deps]

  - action: waste_time
    seconds: 5

  # NO VOICE RESOURCE IS INSTALLED. pma-voice was removed 2026-08-02.
  #
  # This is a change of substance, not tidying. pma-voice is a wrapper over the
  # CLIENT-SIDE Mumble natives. On Enhanced those natives are deprecated: they
  # still function, but only by routing through the new voice implementation,
  # and Cfx has said they will be removed.
  #
  # The replacement is not a like-for-like one. Enhanced's voice API is
  # SERVER-SIDE ONLY — CreateVoiceChannel, AddPlayerToVoiceChannel,
  # SetPlayerMutedInVoiceChannel and so on — and the server owns channel
  # membership, mute, and deaf state outright. Cfx's stated reason is that
  # client-controlled Mumble channels were a security problem.
  #
  # That is the same rule this framework already enforces everywhere else:
  # authority lives on the server. Installing a client-authoritative voice
  # wrapper would contradict it, and nothing in Nexus Core uses voice yet, so
  # there is nothing to keep working in the meantime.
  #
  # nxc_voice targets the Enhanced server-side API directly. MDD v0.4 38.5,
  # conflict C-010, ADR-0017.
  - action: download_github
    src: https://github.com/citizenfx/screenshot-basic
    ref: master
    dest: ./resources/[nexus-deps]/screenshot-basic

  - action: waste_time
    seconds: 5

  # ------------------------------------------------- Nexus Core framework
  # nxc_lib — shared primitives. The root of the dependency graph.
  - action: download_github
    src: https://github.com/NC-Framework/nxc_lib
    ref: main
    dest: ./resources/[nexus]/nxc_lib

  # nxc_core — the framework spine.
  - action: download_github
    src: https://github.com/NC-Framework/nxc_core
    ref: main
    dest: ./resources/[nexus]/nxc_core

  # The remaining foundation resources are scaffolded but not yet implemented.
  # They are added here as each is released, in dependency order:
  #   nxc_config -> nxc_ui -> nxc_zones -> nxc_target -> nxc_interact
  #   -> nxc_devtools
  # They are deliberately absent rather than listed and broken.

  # ---------------------------------------------------------------- clean up
  - action: remove_path
    path: ./tmp
