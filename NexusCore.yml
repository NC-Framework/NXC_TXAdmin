# Nexus Core — txAdmin deployment recipe
#
# Provisions a FiveM server with the Nexus Core framework.
#
# TARGETS GTA V ENHANCED. Nexus Core targets FiveM for GTA V Enhanced and the
# Enhanced Cfx Server runtime (ADR-0016, MDD v0.4 section 38).
#
# A recipe cannot install or verify the server artifacts. txAdmin runs a recipe
# on a server that already exists, so THE OPERATOR IS RESPONSIBLE for having
# installed Enhanced Cfx Server artifacts before deploying this. Running it on
# a Legacy FXServer will appear to succeed.
#
# What the recipe can do, and does: it no longer pins a Legacy game build, and
# it requires the operator to record the exact server build in server.cfg, which
# nxc_core validates at startup and refuses to run without.
#
# THIS RECIPE INSTALLS ONLY WHAT IS PUBLISHED. Nexus Core is in Phase 1 of
# eleven. Framework resources are added to this recipe as each is released; a
# recipe that referenced an unpublished repository would fail at deployment
# while looking complete in review.
#
# See docs/coverage.md for exactly what is and is not installed.

$engine: 3
$minFxVersion: 7290
$onesync: on
$steamRequired: false

name: Nexus Core
version: 0.1.0
author: The Nexus Core Framework team
description: >-
  A custom FiveM roleplay framework built around player experience, useful work,
  meaningful ownership, and interconnected systems. Phase 1 — foundation only.
  Not ready for production use.

tasks:
  # ---------------------------------------------------------------- structure
  - action: ensure_dir
    path: ./resources/[nexus]

  - action: ensure_dir
    path: ./resources/[nexus-deps]

  # ------------------------------------------------------------- base payload
  # Server configuration template and branding, pulled from this repository.
  - action: download_github
    src: https://github.com/NC-Framework/NXC_TXAdmin
    ref: main
    dest: ./tmp/nxc_txadmin

  - action: move_path
    src: ./tmp/nxc_txadmin/data/server.cfg.template
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/nxc_txadmin/myLogo.png
    dest: ./myLogo.png

  # ------------------------------------------------------------------ database
  - action: connect_database

  # Creates the migration-tracking table and nothing else. Every other table
  # belongs to a resource domain, and each resource applies its own migrations
  # at startup. A deployment recipe creating domain tables would be writing
  # state it does not own.
  - action: query_database
    file: ./tmp/nxc_txadmin/data/schema/0001_bootstrap.sql

  # -------------------------------------------------------------- CitizenFX
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  # ------------------------------------------------------------- dependencies
  # oxmysql is the approved database driver and a permanent framework
  # dependency. Pinned to a release rather than a moving branch, so two
  # deployments a week apart install the same code.
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/download/v2.9.1/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[nexus-deps]

  - action: waste_time
    seconds: 5

  # Voice. TEMPORARY, with an end condition.
  #
  # This was previously retained on the strength of MDD v0.3, where replacing
  # pma-voice early was a stated non-goal. v0.4 changed the reasoning: Enhanced
  # ships a new Cfx voice implementation that replaces the Legacy Mumble
  # integration, and the Mumble-compatible natives are deprecated. nxc_voice
  # becomes a first-party abstraction over the Enhanced stack rather than a
  # permanent wrapper around this (section 38.5, conflict C-010).
  #
  # It stays until nxc_voice exists. The disposition did not change; its reason
  # and its expiry did.
  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[nexus-deps]/pma-voice

  - action: download_github
    src: https://github.com/citizenfx/screenshot-basic
    ref: master
    dest: ./resources/[nexus-deps]/screenshot-basic

  - action: waste_time
    seconds: 5

  # ------------------------------------------------- Nexus Core framework
  # nxc_lib — shared primitives. The root of the dependency graph.
  - action: download_github
    src: https://github.com/NC-Framework/nxc_lib
    ref: main
    dest: ./resources/[nexus]/nxc_lib

  # nxc_core — the framework spine.
  - action: download_github
    src: https://github.com/NC-Framework/nxc_core
    ref: main
    dest: ./resources/[nexus]/nxc_core

  # The remaining foundation resources are scaffolded but not yet implemented.
  # They are added here as each is released, in dependency order:
  #   nxc_config -> nxc_ui -> nxc_zones -> nxc_target -> nxc_interact
  #   -> nxc_devtools
  # They are deliberately absent rather than listed and broken.

  # ---------------------------------------------------------------- clean up
  - action: remove_path
    path: ./tmp
